<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="auth-page">

<div class="auth-card">

<h1>Forgot Password</h1>

<p>Enter your email to reset your password.</p>

<form method="POST">

<label>Email</label>

<input 
type="email" 
name="email"
placeholder="you@example.com"
required>

<button type="submit">
Send Reset Link
</button>

</form>

<p>
<a href="{{ url_for('login') }}">
Back to Login
</a>
</p>

</div>

</div>

</body>
</html>
